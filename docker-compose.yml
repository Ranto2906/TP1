version: '3.8'

services:
  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: notes_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: notes_db
      MYSQL_USER: notes_user
      MYSQL_PASSWORD: notes_pass_456
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./WS_ETU003103_ETU003248/script/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - notes_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password_123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Spring Boot
  backend:
    build:
      context: ./WS_ETU003103_ETU003248
      dockerfile: Dockerfile
    container_name: notes_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: notes_db
      DB_USER: notes_user
      DB_PASSWORD: notes_pass_456
      JWT_SECRET: votre_secret_jwt_super_securise_pour_production_2024
      API_PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - notes_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/actuator/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Vue.js
  frontend:
    build:
      context: ./projetNode
      dockerfile: Dockerfile
    container_name: notes_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - notes_network
    environment:
      - VITE_API_URL=http://localhost:3000

networks:
  notes_network:
    driver: bridge

volumes:
  db_data:
